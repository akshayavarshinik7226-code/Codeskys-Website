<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Codeskys.com — your code deserves an audience.">
  <title>{{ platform_name }} · Deploy with confidence</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-burger" id="burger" aria-label="Open navigation">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="top-actions">
        <button class="search-trigger" id="search-trigger" aria-label="Search and commands">
          <svg class="i sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search projects…</span><kbd>⌘K</kbd>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="i" viewBox="0 0 24 24" id="theme-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="notif-btn" aria-label="Notifications">
          <svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot hidden" id="notif-dot"></span>
        </button>
        <button class="avatar" id="avatar-btn" aria-label="Account menu">C</button>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"><div class="content"><div class="skel h" style="width:40%"></div><div class="skel box"></div></div></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/icons.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
